<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tapfolio · Irine Jhane</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f2ea; --surface:#fbf8f1; --ink:#2f1a1a; --muted:#7a6460; --taupe:#b9a29a; --sand:#eadccf; --gold:#6b1d27; --maroon:#6b1d27; --line:rgba(47,26,26,.14);
  --serif:"Instrument Serif","Cormorant Garamond",Georgia,serif; --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1112;--surface:#241819;--ink:#f3e8e0;--muted:#b9a39d;--taupe:#85706b;--sand:#2e1c1d;--gold:#d98a93;--maroon:#8e2a37;--line:rgba(243,232,224,.16)}}
:root[data-theme="dark"]{--bg:#1a1112;--surface:#241819;--ink:#f3e8e0;--muted:#b9a39d;--taupe:#85706b;--sand:#2e1c1d;--gold:#d98a93;--maroon:#8e2a37;--line:rgba(243,232,224,.16)}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.65 var(--sans);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:0 1.5rem}
section{padding:3.5rem 0;border-top:1px solid var(--line)}
section:first-of-type{border-top:0}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.05;letter-spacing:-.01em}
h1,h2{color:var(--gold)}
h2{font-size:2.1rem;margin-bottom:1.1rem}
p{margin:0 0 1rem;color:var(--muted);max-width:52ch}
a{color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}

/* hero */
.hero{padding-top:2.5rem;text-align:center}
.brand{font-size:.95rem;color:var(--muted);letter-spacing:.04em;margin-bottom:2rem}
.brand b{font-family:var(--serif);font-weight:400;font-size:1.25rem;color:var(--ink);letter-spacing:0}
.photo{width:min(62vw,240px);aspect-ratio:4/5;margin:0 auto 2rem;border-radius:999px 999px 1.5rem 1.5rem;border:1px solid var(--gold);padding:7px}
.photo>div{width:100%;height:100%;border-radius:999px 999px 1rem 1rem;background:var(--sand) center/cover no-repeat;display:grid;place-items:center;font:italic 4.5rem var(--serif);color:var(--taupe)}
.hero h1{font-size:clamp(3.2rem,15vw,5.2rem)}
.tag{font-family:var(--serif);font-style:italic;font-size:1.4rem;color:var(--muted);margin:1rem auto 2rem;line-height:1.3}
.btns{display:flex;gap:.75rem;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:.5rem;padding:.9rem 1.6rem;border-radius:999px;border:1px solid var(--maroon);background:var(--maroon);color:#fbf4ec;font:500 .95rem var(--sans);text-decoration:none;cursor:pointer;transition:background .25s,color .25s,transform .25s}
.btn.alt{background:transparent;color:var(--gold);border-color:var(--gold)}
.btn:hover{transform:translateY(-1px)}
.btn.alt:hover{background:var(--sand)}

/* about */
.facts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.4rem}
.chip{padding:.4rem .95rem;border-radius:999px;background:var(--maroon);color:#fbf0e8;font-size:.88rem}

/* contact */
.rows{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:1rem;padding:1.1rem .25rem;border-bottom:1px solid var(--line);text-decoration:none;transition:padding .25s}
a.row:hover{padding-left:.75rem}
.row svg{flex:none}
.row small{display:block;color:var(--muted);font-size:.8rem;line-height:1.2;margin-bottom:.2rem}
.row span{font-size:1.05rem}
.ico{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--gold);text-decoration:none;transition:background .25s,color .25s}
.ico svg,.row svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico:hover{background:var(--maroon);color:#fbf4ec}
.save{margin-top:1.75rem}
.social{display:flex;gap:.8rem;flex-wrap:wrap}

/* work */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.card{border-radius:1.25rem;padding:1.1rem;min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--c,var(--maroon));color:#fbf0e8;background-size:cover}
.card:nth-child(1),.card:nth-child(4){grid-column:span 2;min-height:210px}
.vars{display:grid;gap:1.25rem;margin-top:1.5rem}
.var{border-radius:1.25rem;overflow:hidden;background:var(--maroon);color:#fbf0e8}
.var img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.var div{padding:1.1rem 1.25rem 1.3rem}
.var h3{font-size:1.6rem}
.var p{margin:.35rem 0 0;font-size:.95rem;color:rgba(251,240,232,.82)}
.card h3{font-size:1.5rem}
.card p{color:rgba(251,240,232,.82);font-size:.88rem;margin:.35rem 0 0;line-height:1.4}

/* cta */
.vars{display:grid;gap:1.5rem}
.var h3{font-size:1.6rem;margin:.9rem 0 .2rem}
.var p{margin:0}
.pic{aspect-ratio:4/3;border-radius:1.25rem;background:var(--sand) center/cover no-repeat}
.pic.sticker{display:grid;place-items:center}
.pic.sticker i{width:38%;aspect-ratio:1;border-radius:50%;box-shadow:0 8px 20px rgba(0,0,0,.2);background:radial-gradient(circle,#6b1d27 0 6%,transparent 7% 19%,#6b1d27 20% 23%,transparent 24% 37%,#6b1d27 38% 41%,transparent 42%),#fbf8f1}
.cta{text-align:center;background:var(--maroon);color:#fbf0e8;border-radius:1.75rem;padding:3.25rem 1.5rem;margin-top:1.5rem;border-top:0}
.cta h2{font-size:clamp(2.4rem,11vw,3.6rem);color:#fbf0e8}
.cta p{margin:0 auto 1.8rem;color:rgba(251,240,232,.85)}
.cta .btn{background:#fbf0e8;border-color:#fbf0e8;color:var(--maroon)}
.cta .btn.alt{background:transparent;border-color:#fbf0e8;color:#fbf0e8}
footer{padding:2rem 0 3rem;text-align:center;font-size:.85rem;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));transform:translate(-50%,150%);background:var(--ink);color:var(--bg);padding:.7rem 1.2rem;border-radius:999px;font-size:.9rem;transition:transform .3s;max-width:90vw;text-align:center}
.toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero" id="top">
    <div class="brand">Smart NFC business cards by Irine Jhane</div>
    <div class="photo"><div id="photo" role="img" aria-label="A hand holding a Tapfolio card"></div></div>
    <h1 id="name"></h1>
    <p class="tag" id="tagline"></p>
    <div class="btns">
      <button class="btn" id="saveBtn" type="button">Save my contact</button>
      <a class="btn alt" href="#contact">Connect with me</a>
    </div>
  </section>

  <section id="about">
    <h2>Share more with one tap.</h2>
    <div id="aboutText"></div>
    <div class="facts" id="facts"></div>
  </section>

  <section id="contact">
    <h2>Get in touch</h2>
    <div class="rows" id="rows"></div>
    <button class="btn save" id="saveBtn2" type="button">Save my contact</button>
  </section>

  <section id="social">
    <h2>Find me online</h2>
    <div class="social" id="socials"></div>
  </section>

  <section id="work">
    <h2>What I make</h2>
    <div class="grid" id="work-grid"></div>
  </section>

  <section id="varieties">
    <h2>Choose your finish</h2>
    <p>Every card is NFC-enabled and personalized for you.</p>
    <div class="vars" id="vars"></div>
  </section>

  <section id="cards">
    <h2>Available varieties</h2>
    <p id="varIntro"></p>
    <div class="vars" id="vars"></div>
  </section>

  <section class="cta" id="connect">
    <h2 id="ctaTitle"></h2>
    <p id="ctaText"></p>
    <div class="btns"><a class="btn" id="ctaMail" href="#">Order your card</a><a class="btn alt" id="ctaCall" href="#">Call me</a></div>
  </section>
  <footer id="foot"></footer>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

function svg(k){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+ICONS[k]+'</svg>'}
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var C = CONFIG, tel = C.phone.replace(/[^+\d]/g,'');

$('name').textContent = C.brand;
$('tagline').textContent = C.tagline;
var ph = $('photo');
if (C.photo) { ph.style.backgroundImage = 'url("'+C.photo+'")'; }
else { ph.textContent = C.brand[0]; }
$('aboutText').innerHTML = C.about.map(function(t){return '<p>'+esc(t)+'</p>'}).join('');
$('facts').innerHTML = C.facts.map(function(f){return '<span class="chip">'+esc(f)+'</span>'}).join('');

var rows = [
  {i:'ph', l:'Phone', v:C.phone, h:'tel:'+tel},
  {i:'ph', l:'Phone 2', v:C.phone2, h:'tel:'+C.phone2.replace(/[^+\d]/g,'')},
  {i:'ml', l:'Email', v:C.email, h:'mailto:'+C.email},
  {i:'pin', l:'Location', v:C.location, h:'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(C.location)}
];
if (C.website) rows.push({i:'web', l:'Website', v:C.website.replace(/^https?:\/\//,''), h:C.website});
$('rows').innerHTML = rows.map(function(r){
  return '<a class="row" href="'+esc(r.h)+'"'+(r.i==='pin'||r.i==='web'?' target="_blank" rel="noopener"':'')+'><span class="ico">'+svg(r.i)+'</span><div><small>'+r.l+'</small><span>'+esc(r.v)+'</span></div></a>';
}).join('');

$('socials').innerHTML = C.socials.map(function(s){
  return '<a class="ico" href="'+esc(s.url)+'" target="_blank" rel="noopener" aria-label="'+esc(s.label)+'" title="'+esc(s.label)+'">'+svg(s.icon)+'</a>';
}).join('');

$('work-grid').innerHTML = C.work.map(function(w){
  return '<article class="card" style="--c:'+esc(w.color)+(w.image?';background-image:url('+esc(w.image)+')':'')+'"><h3>'+esc(w.title)+'</h3><p>'+esc(w.text)+'</p></article>';
}).join('');

$('vars').innerHTML = C.varieties.map(function(v){
  var pic = v.image ? '<div class="pic" style="background-image:url(&quot;'+IMGS[v.image]+'&quot;)" role="img" aria-label="'+esc(v.title)+' card"></div>' : '<div class="pic sticker"><i></i></div>';
  return '<article class="var">'+pic+'<h3>'+esc(v.title)+'</h3><p>'+esc(v.text)+'</p></article>';
}).join('');
$('varIntro').textContent = C.varietiesIntro;
$('vars').innerHTML = C.varieties.map(function(v){

}).join('');
$('ctaTitle').textContent = C.ctaTitle;
$('ctaText').textContent = C.ctaText;
$('ctaMail').href = 'mailto:'+C.email+'?subject='+encodeURIComponent('Tapfolio card order');
$('ctaCall').href = 'tel:'+tel;
$('foot').textContent = '© '+new Date().getFullYear()+' '+C.name+' · Tapfolio';

var tt;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on')},3200)}
function vcard(){
  var p = C.name.split(' '), last = p.length>1?p.pop():'', first = p.join(' ');
  return ['BEGIN:VCARD','VERSION:3.0','N:'+last+';'+first+';;;','FN:'+C.name,'ORG:Tapfolio','TITLE:'+C.title,
    'TEL;TYPE=CELL:'+C.phone,'TEL;TYPE=CELL:'+C.phone2,'EMAIL:'+C.email,C.website?'URL:'+C.website:'','ADR;TYPE=WORK:;;'+C.location+';;;;','END:VCARD']
    .filter(Boolean).join('\r\n');
}
async function save(){
  var text = vcard(), fname = C.name.replace(/\s+/g,'-')+'.vcf';
  try{
    var file = new File([text], fname, {type:'text/vcard'});
    if (navigator.canShare && navigator.canShare({files:[file]})) { await navigator.share({files:[file], title:C.name}); return; }
  }catch(e){ if (e && e.name==='AbortError') return; }
  try{
    var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'text/vcard'})); a.download=fname;
    document.body.appendChild(a); a.click(); a.remove(); toast('Contact file ready. Open it to save.');
  }catch(e){}
  try{ await navigator.clipboard.writeText(text); toast('Contact details copied to your clipboard.'); }
  catch(e){ toast('Tap the phone or email above to save me manually.'); }
}
$('saveBtn').onclick = save; $('saveBtn2').onclick = save;
</script>
